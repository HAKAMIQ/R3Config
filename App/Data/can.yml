  inFam1_unst_light_notes: &Infam1_unst_light_notes
    "Increases FPS by around 50% in certain parts by disabling some shadows and lighting.\nDoesn't help much in sewer areas.\nMay break sunlight completely on AMD GPUs using Vulkan.\nMay cause glitches with some other effects like lightning."

  inFam1_disable_vfx_notes: &Infam1_disable_vfx_notes
    "Disables Visual Effects.\nGives just a tiny bit more fps than the 'Unstable VFX' patch.\nUse only as the last resort."

  inFam1_unst_vfx: &Infam1_unst_vfx
    "Increases FPS by about 50% by partially breaking fire, lightning and (some) lighting effects.\nCauses projectiles to become partially invisible."

  inFam1_unst_audio: &Infam1_unst_audio
    "Improves sound cackling by disabling some functions related to the audio.\nLightning sounds might be distorted.\nPlease, report any other side effects."

