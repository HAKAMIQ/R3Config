PPU-fdfcb78c6a8830e27a4a11400048c1b741ed4593:
  "ACB - TaskThread Deadlock Fix [Updated]":
    Games:
      "Assassin's Creed: Brotherhood":
        NPUB30522: [ All ]
    Author: "UCipher"
    Patch Version: 1.1
    Notes: >
      Fixes a threading deadlock/livelock that causes the game to freeze
      during gameplay under RPCS3's PPU LLVM recompiler.

      Changes from v1.0:
        - Introduces use of sys_ppu_thread_yield (syscall 0x4C)

      Certain RPCS3 settings can reintroduce sensitivity to this issue.
      Avoid changing the following from their defaults where possible:
        - Clock speed (PPU/SPU)
        - VBlank frequency
        - Sleep timers accuracy
        - SPU XFloat accuracy
        - Accurate RSX reservations
        - ZCull accuracy

      Remove PPU cache after applying.

    Patch:
      # -------------------------------------------------------
      # Fix 1: Event queue watchdog (50ms timeout for TaskThread)
      # -------------------------------------------------------
      - [ be32, 0x0001C0F0, 0x49E5ED10 ]  # b 0x01E7AE00
      - [ be32, 0x0001C0F4, 0x495AA885 ]  # bl 0x015C6978
      - [ be32, 0x0001C0F8, 0x39600082 ]  # li r11,0x82

      # Codecave @ 0x01E7AE00
      - [ be32, 0x01E7AE00, 0x78090020 ]  # clrldi r9,r0,32
      - [ be32, 0x01E7AE04, 0x3D600050 ]  # lis r11,0x0050
      - [ be32, 0x01E7AE08, 0x396B4B18 ]  # addi r11,r11,0x4B18
      - [ be32, 0x01E7AE0C, 0x7C095800 ]  # cmpw cr0,r9,r11
      - [ be32, 0x01E7AE10, 0x40820010 ]  # bne +0x10
      - [ be32, 0x01E7AE14, 0x38A00000 ]  # li r5,0
      - [ be32, 0x01E7AE18, 0x60A5C350 ]  # ori r5,r5,0xC350
      - [ be32, 0x01E7AE1C, 0x4801C0F6 ]  # ba 0x0001C0F4
      - [ be32, 0x01E7AE20, 0x38A00000 ]  # li r5,0
      - [ be32, 0x01E7AE24, 0x4801C0F6 ]  # ba 0x0001C0F4

      # -------------------------------------------------------
      # Fix 2: Wrapper spin-wait — yield + sleep
      # -------------------------------------------------------
      - [ be32, 0x003932F8, 0x49E7AF42 ]  # ba 0x01E7AF40

      # YIELD_AND_SLEEP_WRAPPER @ 0x01E7AF40
      - [ be32, 0x01E7AF40, 0x3960004C ]  # li r11,0x4C
      - [ be32, 0x01E7AF44, 0x44000002 ]  # sc              (sys_ppu_thread_yield)
      - [ be32, 0x01E7AF48, 0x386009C4 ]  # li r3,2500
      - [ be32, 0x01E7AF4C, 0x3960008D ]  # li r11,0x8D
      - [ be32, 0x01E7AF50, 0x44000002 ]  # sc              (usleep(2500))
      - [ be32, 0x01E7AF54, 0x483932FE ]  # ba 0x003932FC

      # -------------------------------------------------------
      # Fix 3: Inlined TaskThread usleep — yield + sleep
      # -------------------------------------------------------
      - [ be32, 0x00504818, 0x49E7AF02 ]  # ba 0x01E7AF00
      - [ be32, 0x0050481C, 0x60000000 ]  # nop
      - [ be32, 0x00504820, 0x60000000 ]  # nop

      # YIELD_AND_SLEEP_INLINED @ 0x01E7AF00
      - [ be32, 0x01E7AF00, 0x3960004C ]  # li r11,0x4C
      - [ be32, 0x01E7AF04, 0x44000002 ]  # sc              (sys_ppu_thread_yield)
      - [ be32, 0x01E7AF08, 0x386009C4 ]  # li r3,2500
      - [ be32, 0x01E7AF0C, 0x3960008D ]  # li r11,0x8D
      - [ be32, 0x01E7AF10, 0x44000002 ]  # sc              (usleep(2500))
      - [ be32, 0x01E7AF14, 0x48504826 ]  # ba 0x00504824

